<form method="dialog">
    <div class="dialog-header">
        <h2 data-title></h2>
        <button
            class="dialog-maximize"
            type="button"
            data-action="maximize"
            aria-label="Maximize dialog"
            title="Maximize dialog"
            aria-pressed="false"
        >
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect class="maximize-icon-expand" x="4" y="4" width="16" height="16" rx="1" />
                <path
                    class="maximize-icon-restore"
                    d="M8 4h11a1 1 0 0 1 1 1v11h-3V8a1 1 0 0 0-1-1H8V4Zm-3 3h11a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1Z"
                />
            </svg>
        </button>
        <button class="dialog-close" value="cancel" aria-label="Close report dialog" title="Close">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                    d="m18.3 4.3-6.3 6.3-6.3-6.3-1.4 1.4 6.3 6.3-6.3 6.3 1.4 1.4 6.3-6.3 6.3 6.3 1.4-1.4-6.3-6.3 6.3-6.3-1.4-1.4Z"
                />
            </svg>
        </button>
    </div>
    <p>Draw or place an adjustable shape to highlight the problem</p>
    <div class="annotation-toolbar" role="toolbar" aria-label="Annotation tools">
        <div class="toolbar-group" role="group" aria-label="Drawing tools">
            <button
                type="button"
                data-tool="pencil"
                aria-label="Pencil"
                title="Pencil"
                aria-pressed="true"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                        d="M4 16.5V20h3.5L18 9.5 14.5 6 4 16.5Zm16.7-9.2a1 1 0 0 0 0-1.4l-2.6-2.6a1 1 0 0 0-1.4 0L15.1 5l3.5 3.5 2.1-2.2Z"
                    />
                </svg>
            </button>
            <button
                type="button"
                data-tool="rectangle"
                aria-label="Rectangle"
                title="Rectangle"
                aria-pressed="false"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                        d="M3 5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5Zm2 0v14h14V5H5Z"
                    />
                </svg>
            </button>
            <button
                type="button"
                data-tool="select"
                aria-label="Select or adjust"
                title="Select or adjust"
                aria-pressed="false"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                        style="
                            fill: none;
                            stroke: currentColor;
                            stroke-width: 1.6;
                            stroke-linecap: round;
                            stroke-linejoin: round;
                        "
                        d="M8 12V5a1.5 1.5 0 0 1 3 0v6-8a1.5 1.5 0 0 1 3 0v8-6a1.5 1.5 0 0 1 3 0v7-4a1.5 1.5 0 0 1 3 0v7c0 4-2 7-6 7h-2c-2 0-3-1-4-3l-4-6a1.5 1.5 0 0 1 2-2l2 2"
                    />
                </svg>
            </button>
        </div>
        <div class="toolbar-group" role="group" aria-label="Annotation options">
            <label class="annotation-color" title="Annotation color"
                ><span>Annotation color</span
                ><input type="color" value="#ef4444" aria-label="Annotation color"
            /></label>
            <button
                type="button"
                data-tool="eraser"
                aria-label="Erase annotation"
                title="Erase annotation"
                aria-pressed="false"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="m3 15 10-12 8 7-10 12H9L3 15Zm3 0 4 4h1l3-4-5-4-3 4Z" />
                </svg>
            </button>
        </div>
        <span class="toolbar-spacer" aria-hidden="true"></span>
        <div class="toolbar-group" role="group" aria-label="Screenshot view">
            <button
                type="button"
                data-action="fit"
                aria-label="Fit screenshot"
                title="Fit screenshot"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                        d="M3 3h6v2H5v4H3V3Zm12 0h6v6h-2V5h-4V3ZM3 15h2v4h4v2H3v-6Zm16 0h2v6h-6v-2h4v-4Z"
                    />
                </svg>
            </button>
            <button type="button" data-action="zoom-out" aria-label="Zoom out" title="Zoom out">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                        d="M10 4a6 6 0 1 1 0 12 6 6 0 0 1 0-12Zm0 2a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm-7 5h14v-2H3v2Zm12.7 4.3 1.4-1.4L22 18.8 20.8 20l-5.1-4.7Z"
                    />
                </svg>
            </button>
            <button type="button" data-action="zoom-in" aria-label="Zoom in" title="Zoom in">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                        d="M10 4a6 6 0 1 1 0 12 6 6 0 0 1 0-12Zm1 3H9v2H7v2h2v2h2v-2h2V9h-2V7Zm4.7 8.3 1.4-1.4L22 18.8 20.8 20l-5.1-4.7Z"
                    />
                </svg>
            </button>
        </div>
    </div>
    <div class="canvas-wrap"><canvas aria-label="Screenshot annotation canvas"></canvas></div>
    <label
        ><span data-label="comment">Comment (optional)</span
        ><textarea rows="4" maxlength="5000"></textarea>
    </label>
    <div class="actions">
        <button type="button" data-action="clear">Clear drawing</button>
        <span></span>
        <button value="cancel">Cancel</button>
        <button value="confirm" class="primary">Generate Report</button>
    </div>
</form>
