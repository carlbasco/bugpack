<form method="dialog">
    <div class="dialog-header">
        <h2 data-title></h2>
        <button
            class="dialog-maximize"
            type="button"
            data-action="maximize"
            aria-label="Maximize dialog"
            title="Maximize dialog"
            aria-pressed="false"
        >
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect class="maximize-icon-expand" x="4" y="4" width="16" height="16" rx="1" />
                <path
                    class="maximize-icon-restore"
                    d="M8 4h11a1 1 0 0 1 1 1v11h-3V8a1 1 0 0 0-1-1H8V4Zm-3 3h11a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1Z"
                />
            </svg>
        </button>
        <button class="dialog-close" value="cancel" aria-label="Close report dialog" title="Close">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                    d="m18.3 4.3-6.3 6.3-6.3-6.3-1.4 1.4 6.3 6.3-6.3 6.3 1.4 1.4 6.3-6.3 6.3 6.3 1.4-1.4-6.3-6.3 6.3-6.3-1.4-1.4Z"
                />
            </svg>
        </button>
    </div>
    <p>Draw or place an adjustable shape to highlight the problem</p>
    <div class="annotation-toolbar" role="toolbar" aria-label="Annotation tools">
        <div class="toolbar-group" role="group" aria-label="Drawing tools">
            <button
                type="button"
                data-tool="pencil"
                aria-label="Pencil"
                title="Pencil"
                aria-pressed="true"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                        d="M21.707 5.565 18.435 2.293a1 1 0 0 0-1.414 0L3.93 15.384a.991.991 0 0 0-.242.39l-1.636 4.91A1 1 0 0 0 3 22a.987.987 0 0 0 .316-.052l4.91-1.636a.991.991 0 0 0 .39-.242L21.707 6.979a1 1 0 0 0 0-1.414ZM7.369 18.489l-2.788.93.93-2.788 8.943-8.944 1.859 1.859ZM17.728 8.132l-1.86-1.86 1.86-1.858 1.858 1.858Z"
                    />
                </svg>
            </button>
            <button
                type="button"
                data-tool="rectangle"
                aria-label="Rectangle"
                title="Rectangle"
                aria-pressed="false"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                        d="M3 5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5Zm2 0v14h14V5H5Z"
                    />
                </svg>
            </button>
            <button
                type="button"
                data-tool="select"
                aria-label="Select or adjust"
                title="Select or adjust"
                aria-pressed="false"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                        d="M12 3v18M12 3 9 6M12 3l3 3M12 21l3-3M12 21l-3-3M3 12h18M3 12l3 3M3 12l3-3M21 12l-3-3M21 12l-3 3"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />
                </svg>
            </button>
        </div>
        <div class="toolbar-group" role="group" aria-label="Annotation options">
            <label class="annotation-color"
                ><input type="color" value="#ef4444" aria-label="Color"
            /></label>
            <button type="button" data-tool="eraser" aria-label="Erase" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                        d="m5.505 11.41.53.53-.53-.53ZM3 14.952h-.75H3ZM9.048 21v.75V21ZM11.41 5.505l-.53-.53.53.53Zm1.831 12.339a.75.75 0 1 0 1.06-1.06l-1.06 1.06ZM7.216 9.698a.75.75 0 0 0-1.06 1.06l1.06-1.06Zm10.749 2.362-5.905 5.905 1.06 1.06 5.905-5.905-1.06-1.06ZM6.035 11.94 11.94 6.035l-1.06-1.06-5.905 5.905 1.06 1.06Zm0 6.025c-.85-.85-1.433-1.435-1.813-1.933-.366-.48-.472-.79-.472-1.08h-1.5c0 .749.312 1.375.78 1.989.456.597 1.125 1.264 1.945 2.084l1.06-1.06ZM4.975 10.88c-.82.82-1.49 1.486-1.945 2.083-.468.614-.78 1.24-.78 1.99h1.5c0-.29.106-.6.473-1.08.38-.498.962-1.084 1.812-1.934l-1.06-1.06Zm7.085 7.085c-.85.85-1.435 1.433-1.933 1.813-.48.366-.79.472-1.079.472v1.5c.749 0 1.375-.312 1.989-.78.597-.456 1.264-1.125 2.084-1.945l-1.06-1.06Zm-7.085 1.06c.82.82 1.487 1.49 2.084 1.945.614.468 1.24.78 1.989.78v-1.5c-.289 0-.6-.106-1.079-.473-.498-.38-1.084-.962-1.934-1.812l-1.06 1.06Zm12.99-12.99c.85.85 1.433 1.435 1.813 1.933.366.48.472.79.472 1.08h1.5c0-.749-.312-1.375-.78-1.989-.456-.597-1.125-1.264-1.945-2.084l-1.06 1.06Zm1.06 7.085c.82-.82 1.49-1.487 1.945-2.084.468-.614.78-1.24.78-1.989h-1.5c0 .289-.106.6-.473 1.079-.38.498-.962 1.084-1.812 1.934l1.06 1.06Zm0-8.146c-.82-.82-1.487-1.49-2.084-1.945-.614-.468-1.24-.78-1.989-.78v1.5c.289 0 .6.106 1.079.473.498.38 1.084.962 1.934 1.812l1.06-1.06ZM11.94 6.035c.85-.85 1.435-1.433 1.933-1.813.48-.366.79-.472 1.079-.472v-1.5c-.749 0-1.375.312-1.989.78-.597.456-1.264 1.125-2.084 1.945l1.06 1.06Z"
                    />
                    <path
                        d="M9 21h12"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.5"
                        stroke-linecap="round"
                    />
                </svg>
            </button>
        </div>
        <span class="toolbar-spacer" aria-hidden="true"></span>
        <div class="toolbar-group" role="group" aria-label="Screenshot view">
            <button
                type="button"
                data-action="fit"
                aria-label="Fit screenshot"
                title="Fit screenshot"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                        d="M3 3h6v2H5v4H3V3Zm12 0h6v6h-2V5h-4V3ZM3 15h2v4h4v2H3v-6Zm16 0h2v6h-6v-2h4v-4Z"
                    />
                </svg>
            </button>
            <button type="button" data-action="zoom-out" aria-label="Zoom out" title="Zoom out">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                        d="M10 4a6 6 0 1 1 0 12 6 6 0 0 1 0-12Zm0 2a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm-7 5h14v-2H3v2Zm12.7 4.3 1.4-1.4L22 18.8 20.8 20l-5.1-4.7Z"
                    />
                </svg>
            </button>
            <button type="button" data-action="zoom-in" aria-label="Zoom in" title="Zoom in">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                        d="M10 4a6 6 0 1 1 0 12 6 6 0 0 1 0-12Zm1 3H9v2H7v2h2v2h2v-2h2V9h-2V7Zm4.7 8.3 1.4-1.4L22 18.8 20.8 20l-5.1-4.7Z"
                    />
                </svg>
            </button>
        </div>
    </div>
    <div class="canvas-wrap"><canvas aria-label="Screenshot annotation canvas"></canvas></div>
    <label
        ><span data-label="comment">Comment (optional)</span
        ><textarea rows="4" maxlength="5000"></textarea>
    </label>
    <div class="actions">
        <button type="button" data-action="clear">Clear drawing</button>
        <span></span>
        <button value="cancel">Cancel</button>
        <button value="confirm" class="primary">Generate Report</button>
    </div>
</form>
